<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTER</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        header {
            padding-left: 30px;
            padding-right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #033152;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
            color: white;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: #033152;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            color: hwb(205 81% 3%);
        }

        main {
            padding-left: 30px;
            padding-right: 30px;
            max-width: 550px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
        }

        footer {
            padding-bottom: 40px;
            background-color: #ffffff;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-style: normal;
            font-size: 15px;
            color: #f9c6cf;
            background-color: #033152;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Style for input fields */
        .input-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 18px;
            color: white;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .calendar-icon {
            cursor: pointer;
            margin-left: 10px;
            font-size: 1.2em;
            vertical-align: middle;
        }

        .date-wrapper {
            display: flex;
            align-items: center;
        }

        #native-birthdate {
            visibility: hidden;
            position: absolute;
            opacity: 0;
        }

    </style>
</head>

<body>

    <header>
        <h1>Tester</h1>
    </header>

    <main>
        <div class="input-container">
            <!-- Birthdate with mask (custom input) -->
            <label for="birthdate-mask">Enter your Birthdate:</label>
            <div class="date-wrapper">
                <input type="text" id="birthdate-mask" name="birthdate-mask" inputmode="numeric" autocomplete="bday" placeholder="DD/MM/YYYY" pattern="([0-2][0-9]|(3)[0-1])\/(0[1-9]|1[0-2])\/\d{4}" maxlength="10" required>
                <!-- Calendar Icon -->
                <span id="calendar-icon" class="calendar-icon">&#128197;</span>
            </div>
        </div>

        <form>
            <h2>Address Information</h2>

            <label for="country">Country:</label><br>
            <input type="text" id="country" name="country" value="Belgium" required><br><br>

            <label for="street">Street Address:</label><br>
            <input type="text" id="street" name="street" required><br><br>

            <label for="city">City:</label><br>
            <input type="text" id="city" name="city" required><br><br>

            <label for="postal">Postal Code:</label><br>
            <input type="text" id="postal" name="postal" required><br><br>

            <input type="submit" value="Submit">
        </form>
    </main>

    <footer>
        <p><a href="https://dewilvis.be/test.html">this is a tester page v10</a></p>
    </footer>

    <script>
        function applyDateMask(event) {
            const input = event.target;
            let raw = input.value.replace(/\D/g, ''); // Remove all non-digits

            let day = '', month = '', year = '';
            let index = 0;

            // ----- DAY -----
            if (raw.length >= 1) {
                const firstDayDigit = parseInt(raw[0]);
                if (raw.length === 1) {
                    if (firstDayDigit >= 4) {
                        day = '0' + raw[0];
                        index = 1;
                    } else {
                        day = raw[0];
                        index = 1;
                    }
                } else {
                    day = raw.slice(0, 2);
                    index = 2;
                }
            }

            // ----- MONTH -----
            if (raw.length > index) {
                const monthPart = raw.slice(index);
                if (monthPart.length === 1) {
                    const firstMonthDigit = parseInt(monthPart[0]);
                    if (firstMonthDigit >= 2) {
                        month = '0' + monthPart[0];
                        index += 1;
                    } else {
                        month = monthPart[0];
                        index += 1;
                    }
                } else if (monthPart.length >= 2) {
                    month = monthPart.slice(0, 2);
                    index += 2;
                }
            }

            // ----- YEAR -----
            if (raw.length > index) {
                let yearPart = raw.slice(index, index + 4);

                // Check if first digit is > 5 and only one digit has been typed
                if (yearPart.length === 1 && parseInt(yearPart[0]) > 5) {
                    yearPart = '19' + yearPart;
                }
                year = yearPart;
            }
            
            // ----- FORMAT -----
            let result = '';
            if (day.length === 2) {
                result += day;
            } else if (day.length === 1) {
                result += day;
            }

            if (month.length === 2) {
                result += '/' + month;
            } else if (month.length === 1) {
                result += '/' + month;
            }

            if (year) {
                result += '/' + year;
            }

            input.value = result;
        }
        document.getElementById('birthdate-mask').addEventListener('input', applyDateMask);
    </script>

    
</body>

</html>
