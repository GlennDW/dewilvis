name: Drinks service
on:
  push:
    paths: ['drinks-service/**', 'app.js', 'site-registry.js', 'drinks.html', 'private.html', 'private.js', 'styles.css', '.github/workflows/drinks.yml']
  pull_request:
    paths: ['drinks-service/**', 'app.js', 'site-registry.js', 'drinks.html', 'private.html', 'private.js', 'styles.css', '.github/workflows/drinks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drinks-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drinks-service/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check
