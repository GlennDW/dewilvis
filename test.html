<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <title>TESTER</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>


<style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    header {
        padding-left: 30px;
        padding-right: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #033152;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 50px;
        color: white;
    }

    body {

        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background-color: #033152;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 20px;
        color: hwb(205 81% 3%);
    }

    main {
        padding-left: 30px;
        padding-right: 30px;
        max-width: 550px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
    }

    .logo {
        width: 250px; /* Adjust size as needed */
        height: auto;
        margin-top: 20px; /* Optional spacing */
    }

    footer {
        padding-bottom: 40px;
        background-color: #ffffff;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-style: normal;
        font-size: 15px;
        color:  #f9c6cf /* hwb(205 81% 3%) */;
        background-color: #033152;
    }

    a {
        text-decoration: none; /* Remove underline */
        color: inherit; /* Make the color the same as the surrounding text */
    }

    /* Style for input fields */
    .input-container {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
    }

    label {
        font-size: 18px;
        color: white;
    }

    input {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    /*
        geel: #fef7ea
        roze: #f9c6cf
        rood: #e14232
        groen: #5ea190
    */

</style>

    <header>
        <h1>Tester</h1>
    </header>

    <main>
        <div class="input-container">
            <label for="text">Enter Some Text:</label>
            <input type="text" id="text" name="text" placeholder="Type here...">

            <label for="date">Select a Date:</label>
            <input type="date" id="birthdate" name="birthdate" inputmode="numeric" autocomplete="bday" pattern="\d{2}-\d{2}-\d{4}">
            
            <label for="birthdate">Enter your Birthdate:</label>
            <input type="text" id="birthdate" name="birthdate"  inputmode="numeric" autocomplete="bday" placeholder="DD/MM/YYYY" pattern="([0-2][0-9]|(3)[0-1])\/(0[1-9]|1[0-2])\/\d{4}" 

            <div class="date-container">
                <input type="text" id="day" name="day" inputmode="numeric" pattern="[0-9]{2}" placeholder="DD" maxlength="2" required>
                <input type="text" id="month" name="month" inputmode="numeric" pattern="[0-9]{2}" placeholder="MM" maxlength="2" required>
                <input type="text" id="year" name="year" inputmode="numeric" pattern="[0-9]{4}" placeholder="YYYY" maxlength="4" required>
            </div>

            <script>
                // Function to autofill the birthdate fields
                function autofillBirthdate(date) {
                    // Split the date into day, month, and year
                    const day = String(date.getDate()).padStart(2, '0');  // Ensure two digits
                    const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are 0-based
                    const year = date.getFullYear();
        
                    // Autofill the input fields
                    document.getElementById('day').value = day;
                    document.getElementById('month').value = month;
                    document.getElementById('year').value = year;
                }
        
                // Example: Autofill with a default birthdate (e.g., January 15, 1990)
                const defaultBirthdate = new Date(1990, 0, 15); // Month is 0-based (0 = January)
                autofillBirthdate(defaultBirthdate);
            </script>

            <label for="time">Select a Time:</label>
            <input type="time" id="time" name="time">
        </div>

    </main>

    <footer>
        <p><a href="https://dewilvis.be/test.html">this is a tester page v7</a></p>
    </footer>

</html>
